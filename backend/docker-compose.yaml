name: codelab-site-dev

services:
  backend:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - logs:/app/logs
    depends_on:
      - postgres

  postgres:
    image: postgres:13-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  pgweb:
    image: sosedoff/pgweb:0.13.1
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - DATABASE_URL=${PGWEB_DATABASE_URL}
    depends_on:
      - postgres

volumes:
  postgres_data:
  logs: